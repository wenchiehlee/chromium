name: Build and Push Custom Chromium Image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version override (e.g., 1.0.0)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'metadata.json'
      - 'README.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Chromium Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine semantic version tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ -f "metadata.json" ]; then
            VERSION=$(node -p "try { require('./metadata.json').version } catch(e) { '' }")
          fi
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          # Normalize: strip leading 'v' if present to ensure clean semver
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION, tag: v$VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chromium:v${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chromium:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description & Overview
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/chromium
          short-description: "Chromium with pre-installed Chinese fonts, KasmVNC web GUI, and supervised CDP proxy on Synology NAS"
          readme-filepath: README.md
